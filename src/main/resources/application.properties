
spring.application.name=turma-service

# Variáveis locais lidas do arquivo .env, se existir (não versionado).
spring.config.import=optional:file:.env[.properties]

# Servidor
server.port=${PORT:8080}
server.address=0.0.0.0
# Respeita X-Forwarded-* do proxy do Railway (gera URLs https no Swagger)
server.forward-headers-strategy=framework

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?connectionTimeZone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Autenticação
jwt.secret=${JWT_SECRET}
